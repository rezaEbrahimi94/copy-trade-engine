# Round-robin load balancer in front of every `api` replica (docker compose --scale / replicas).
# `resolve` re-reads Docker DNS, so replicas that are added, restarted or removed are picked up
# without reloading nginx. POST is not retried on another replica (non-idempotent by default);
# the API is idempotent anyway, but the client decides whether to retry.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream api {
  zone api_replicas 64k;
  server api:3000 resolve;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  location = /lb-health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Upstream-Addr $upstream_addr always;
  }
}
