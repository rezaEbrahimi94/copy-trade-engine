# `docker compose up --build` -> Postgres, Redpanda (+ Console), migrations, 3 API replicas
# behind an nginx load balancer, N copy-trade workers (one consumer group) and the UI.
#   UI:               http://localhost:${WEB_PORT:-8080}
#   API (via the LB): http://localhost:${API_PORT:-3000}
#   Redpanda Console: http://localhost:${CONSOLE_PORT:-8090}
#   Kafka (host):     localhost:${KAFKA_EXTERNAL_PORT:-19092}
# Scale at runtime: docker compose up -d --scale api=5 --scale worker=4
name: copy-trade

x-database-url: &database-url postgres://${POSTGRES_USER:-copytrade}:${POSTGRES_PASSWORD:-copytrade}@postgres:5432/${POSTGRES_DB:-copytrade}

services:
  postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copytrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copytrade}
      POSTGRES_DB: ${POSTGRES_DB:-copytrade}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - '${KAFKA_EXTERNAL_PORT:-19092}:19092'
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - redpanda:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:v3.2.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - '${CONSOLE_PORT:-8090}:8080'
    depends_on:
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: copy-trade-api:local
    command: ['node', 'dist/jobs/migrate.mjs']
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: copy-trade-api:local
    deploy:
      replicas: ${API_REPLICAS:-3}
    environment:
      DATABASE_URL: *database-url
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-30000}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_REQUESTED_PARTITIONS: ${KAFKA_REQUESTED_PARTITIONS:-6}
      CONSOLE_URL: http://localhost:${CONSOLE_PORT:-8090}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  lb:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${API_PORT:-3000}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health/ready >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    image: copy-trade-worker:local
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    stop_grace_period: 20s
    environment:
      DATABASE_URL: *database-url
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-10}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_REQUESTED_PARTITIONS: ${KAFKA_REQUESTED_PARTITIONS:-6}
      KAFKA_SESSION_TIMEOUT_MS: ${KAFKA_SESSION_TIMEOUT_MS:-10000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_SIMULATED_LATENCY_MS: ${WORKER_SIMULATED_LATENCY_MS:-0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: copy-trade-web:local
    environment:
      API_UPSTREAM: http://lb:80
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      lb: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
